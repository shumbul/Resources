name: Lint HTML

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  htmlhint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run HTMLHint
        run: npx --yes htmlhint "docs/**/*.html"

  seo-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify SEO tags are baked into every page
        # Social crawlers do not run JavaScript, so these tags must exist in the
        # HTML source. This fails if someone adds a page without running
        # `python build-seo.py`.
        run: python build-seo.py --check
