name: Lint HTML

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  htmlhint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run HTMLHint
        run: npx --yes htmlhint "docs/**/*.html"

  seo-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify SEO tags are baked into every page
        # Social crawlers do not run JavaScript, so these tags must exist in the
        # HTML source. This fails if someone adds a page without running
        # `python build-seo.py`.
        run: python build-seo.py --check

      - name: Verify critical CSS is linked from <head>
        # The layout stylesheets must load before first paint. If they only
        # arrive via the JS-loaded head-common partial, the page paints
        # unstyled and then jumps, which is severe layout shift.
        run: python build-critical-css.py --check

      - name: Verify the visual layer is enabled on every page
        # Without data-futuristic a page falls back to a flat header and looks
        # different from the rest of the site.
        run: python build-futuristic.py --check

      - name: Verify Quick Jump and journey slots are pre-rendered
        # These used to be built in the browser and inserted after paint, which
        # pushed the whole page down. Both are now written into the HTML, so a
        # new or edited page has to be regenerated or it regresses.
        run: python build-quickjump.py --check

      - name: Verify the back link is pre-rendered
        # Same reason: injecting it at runtime grew the header after paint.
        run: python build-backlink.py --check
